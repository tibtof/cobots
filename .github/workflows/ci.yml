name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Structural lint + trigger checks
        run: python3 evals/check.py
      - name: Hook script syntax
        run: for f in core/hooks/scripts/*.sh; do bash -n "$f"; done
      - name: Workflow script syntax
        run: node --check core/workflows/issue-pipeline.js || true

  verified-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install jbang
        run: |
          curl -Ls https://sh.jbang.dev | bash -s - app setup
          echo "$HOME/.jbang/bin" >> "$GITHUB_PATH"
      - name: Compile java-idioms examples
        run: jbang lang/java/skills/java-idioms/scripts/VerifyExamples.java
